<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>🏆 MVNX</title>

<!-- Preconnect for faster CDN loads -->
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>

<!-- React -->
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<style>
  :root {
    --bg: #fff8f0;
    --card: #ffffff;
    --ink: #2b2b3a;
    --muted: #8a8a9a;
    --purple: #7c5cff;
    --purple-dark: #6a46ff;
    --pink: #ff5da2;
    --yellow: #ffc93c;
    --green: #34d399;
    --red: #ff6161;
    --blue: #3b9dff;
    --radius: 20px;
    --shadow: 0 8px 24px rgba(60, 40, 90, 0.10);
    --shadow-lg: 0 14px 34px rgba(60, 40, 90, 0.18);
    --ease: cubic-bezier(.22,1,.36,1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 10% 10%, #ffe3f0 0%, transparent 40%),
      radial-gradient(circle at 90% 0%, #e3f0ff 0%, transparent 40%),
      radial-gradient(circle at 50% 100%, #fff3d6 0%, transparent 45%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--purple); color: #fff; }

  /* ---------- loading splash (shown until React mounts) ---------- */
  #splash {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; background: var(--bg); z-index: 999;
    transition: opacity .35s ease, visibility .35s ease;
  }
  #splash .emoji { font-size: 46px; animation: bounce 1s infinite ease-in-out; }
  #splash .txt { font-weight: 800; color: var(--muted); font-size: 14px; letter-spacing: .3px; }
  #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  .wrap { max-width: 760px; margin: 0 auto; padding: 18px 16px 90px; animation: fadeUp .45s var(--ease); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.94) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes shimmerPop {
    0% { transform: scale(1); }
    35% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  @keyframes floatIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 4px 20px;
  }
  .logo {
    font-size: clamp(20px, 5vw, 26px); font-weight: 800; display: flex; align-items: center; gap: 8px;
  }
  .logo span.dot { color: var(--purple); }
  .app-subtitle { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .3px; margin-top: -2px; }
  .logo-badge {
    width: 40px; height: 40px; border-radius: 12px; overflow: hidden; flex-shrink: 0;
    background: #0b0b14; box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center;
  }
  .logo-badge img { width: 100%; height: 100%; object-fit: cover; }
  .logo-badge.lg { width: 96px; height: 96px; border-radius: 22px; margin: 0 auto 14px; box-shadow: var(--shadow-lg); }
  .logo-badge.splash { width: 84px; height: 84px; border-radius: 20px; animation: bounce 1.4s infinite ease-in-out; }
  .logo .trophy { display: inline-block; animation: bounce 2.6s infinite ease-in-out; }

  .tabs {
    display: flex; gap: 6px; background: #fff; padding: 6px; border-radius: 999px;
    box-shadow: var(--shadow); margin-bottom: 20px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1; text-align: center; padding: 10px 14px; border-radius: 999px;
    cursor: pointer; font-weight: 700; font-size: 14px; color: var(--muted);
    transition: color .2s var(--ease), transform .15s var(--ease); user-select: none; min-width: 84px;
    white-space: nowrap; position: relative;
  }
  .tab:active { transform: scale(.94); }
  .tab.active { background: linear-gradient(135deg, var(--purple), var(--pink)); color: #fff; box-shadow: 0 4px 14px rgba(124,92,255,.35); }
  @media (hover: hover) {
    .tab:not(.active):hover { color: var(--ink); background: #f5f4ff; }
  }

  .card {
    background: var(--card); border-radius: var(--radius); padding: 20px;
    box-shadow: var(--shadow); margin-bottom: 18px;
    animation: floatIn .4s var(--ease);
    transition: box-shadow .25s var(--ease);
  }

  h2 { margin: 0 0 14px; font-size: clamp(17px, 4.5vw, 20px); }
  label { font-weight: 700; font-size: 13px; color: var(--muted); display: block; margin: 12px 0 6px; }
  input[type=text], input[type=password], input[type=number], select, textarea {
    width: 100%; padding: 12px 14px; border-radius: 14px; border: 2px solid #eee;
    font-size: 16px; outline: none; font-family: inherit; background: #fbfbff;
    transition: border-color .2s var(--ease), box-shadow .2s var(--ease), transform .15s var(--ease);
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--purple); box-shadow: 0 0 0 4px rgba(124,92,255,.14);
  }
  textarea { resize: vertical; min-height: 70px; }

  .cat-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .cat-pill {
    padding: 9px 15px; border-radius: 999px; font-weight: 700; font-size: 13px;
    cursor: pointer; border: 2px solid transparent; background: #f2f2f7; color: var(--ink);
    transition: transform .15s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease), color .2s var(--ease);
    user-select: none;
  }
  .cat-pill:active { transform: scale(.92); }
  .cat-pill.selected { color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(0,0,0,.15); animation: shimmerPop .3s var(--ease); }
  @media (hover: hover) {
    .cat-pill:not(.selected):hover { transform: translateY(-2px); background: #ebebf5; }
  }

  .file-btn {
    display: flex; align-items: center; gap: 10px; margin-top: 6px;
    padding: 13px 14px; border-radius: 14px; border: 2px dashed #ddd; cursor: pointer;
    background: #fbfbff; color: var(--muted); font-weight: 600; font-size: 14px;
    transition: border-color .2s var(--ease), background .2s var(--ease), transform .15s var(--ease);
  }
  .file-btn:active { transform: scale(.98); }
  .file-btn.has-file { border-color: var(--green); color: var(--ink); background: #f2fdf8; }
  @media (hover: hover) {
    .file-btn:hover { border-color: var(--purple); background: #f7f6ff; }
  }

  .btn {
    margin-top: 18px; width: 100%; padding: 14px; border: none; border-radius: 16px;
    font-weight: 800; font-size: 15px; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    box-shadow: 0 6px 18px rgba(124,92,255,.35);
    transition: transform .15s var(--ease), box-shadow .2s var(--ease), filter .2s var(--ease);
  }
  .btn:active:not(:disabled) { transform: scale(.96); box-shadow: 0 3px 10px rgba(124,92,255,.3); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  @media (hover: hover) {
    .btn:not(:disabled):hover { transform: translateY(-2px); filter: brightness(1.05); box-shadow: var(--shadow-lg); }
  }
  .btn.secondary {
    background: #fff; color: var(--purple); border: 2px solid var(--purple); box-shadow: none;
  }

  .points-banner {
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    color: #fff; border-radius: var(--radius); padding: 22px 24px; margin-bottom: 18px;
    box-shadow: var(--shadow-lg); position: relative; overflow: hidden;
    animation: floatIn .45s var(--ease);
  }
  .points-banner::after {
    content: ""; position: absolute; top: -40%; right: -10%; width: 160px; height: 160px;
    background: rgba(255,255,255,.12); border-radius: 50%;
  }
  .points-banner .num { font-size: clamp(32px, 9vw, 40px); font-weight: 900; line-height: 1; animation: popIn .5s var(--ease); }
  .points-banner .lbl { font-size: 13px; opacity: .9; font-weight: 600; }
  .avatar-circle {
    width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.25);
    display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800;
    flex-shrink: 0; box-shadow: 0 0 0 3px rgba(255,255,255,.25); overflow: hidden;
  }
  .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }

  .avatar-uploader { position: relative; width: 84px; height: 84px; margin: 0 auto 14px; }
  .avatar-uploader .avatar-img-circle {
    width: 84px; height: 84px; border-radius: 50%; overflow: hidden;
    background: linear-gradient(135deg, var(--purple), var(--pink));
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; color: #fff;
    box-shadow: var(--shadow-lg); border: 3px solid #fff;
  }
  .avatar-uploader .avatar-img-circle img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-edit-btn {
    position: absolute; bottom: -2px; right: -2px; width: 30px; height: 30px; border-radius: 50%;
    background: var(--purple); color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 14px; border: 3px solid #fff; cursor: pointer; box-shadow: var(--shadow);
    transition: transform .15s var(--ease);
  }
  .avatar-edit-btn:active { transform: scale(.88); }
  @media (hover: hover) {
    .avatar-edit-btn:hover { transform: scale(1.08); }
  }
  .avatar-uploader input[type=file] { display: none; }

  .mini-avatar { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex-shrink: 0; box-shadow: 0 0 0 2px #fff; }
  .mini-avatar-fallback {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--purple), var(--pink)); color: #fff; font-size: 10px; font-weight: 800;
    box-shadow: 0 0 0 2px #fff;
  }

  .ach-item {
    display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 16px;
    background: #fbfbff; margin-bottom: 10px; border: 1px solid #f0f0f5;
    transition: transform .18s var(--ease), box-shadow .18s var(--ease);
    animation: floatIn .35s var(--ease);
  }
  @media (hover: hover) {
    .ach-item:hover { transform: translateX(2px); box-shadow: 0 4px 14px rgba(60,40,90,.08); }
  }
  .ach-thumb { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; flex-shrink: 0; background: #eee; }
  .ach-info { flex: 1; min-width: 0; }
  .ach-title { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
  .ach-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .badge {
    font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  }
  .badge.pending { background: #fff4d6; color: #b8860b; }
  .badge.approved { background: #d9f9ea; color: #0f9d58; }
  .badge.rejected { background: #ffe1e1; color: #d13c3c; }
  .pts-chip {
    font-weight: 800; font-size: 13px; color: var(--purple); white-space: nowrap;
    background: #f1eeff; padding: 5px 10px; border-radius: 999px;
  }

  .empty { text-align: center; color: var(--muted); padding: 34px 10px; font-size: 14px; }
  .empty .emoji { font-size: 38px; display: block; margin-bottom: 8px; animation: bounce 2s infinite ease-in-out; }

  .name-gate {
    display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
  }
  .name-card { max-width: 380px; width: 100%; text-align: center; animation: popIn .5s var(--ease); }
  .name-card .emoji { font-size: 48px; animation: bounce 1.8s infinite ease-in-out; }

  .admin-item {
    padding: 14px; border-radius: 16px; background: #fbfbff; border: 1px solid #f0f0f5; margin-bottom: 12px;
    transition: box-shadow .2s var(--ease);
    animation: floatIn .35s var(--ease);
  }
  .admin-row-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .admin-desc { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .admin-actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .pts-input {
    width: 72px; padding: 8px 10px; border-radius: 10px; border: 2px solid #eee; font-weight: 700; text-align: center;
  }
  .mini-btn {
    padding: 9px 16px; border-radius: 12px; border: none; font-weight: 800; font-size: 13px; cursor: pointer; color: #fff;
    transition: transform .15s var(--ease), filter .2s var(--ease);
  }
  .mini-btn:active:not(:disabled) { transform: scale(.92); }
  .mini-btn.approve { background: var(--green); }
  .mini-btn.reject { background: var(--red); }
  .mini-btn:disabled { opacity: .5; cursor: not-allowed; }
  @media (hover: hover) {
    .mini-btn:not(:disabled):hover { filter: brightness(1.08); transform: translateY(-1px); }
  }

  .lead-row {
    display: flex; align-items: center; gap: 12px; padding: 11px 6px; border-bottom: 1px solid #f2f2f5;
    transition: background .15s var(--ease); border-radius: 10px; flex-wrap: wrap;
  }
  @media (hover: hover) {
    .lead-row:hover { background: #faf9ff; }
  }
  .lead-rank { font-weight: 900; width: 28px; color: var(--muted); font-size: 15px; }
  .lead-name { flex: 1; font-weight: 700; overflow-wrap: anywhere; }
  .lead-pts { font-weight: 800; color: var(--purple); white-space: nowrap; }

  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-pill {
    padding: 7px 15px; border-radius: 999px; background: #f2f2f7; font-size: 12px; font-weight: 700;
    cursor: pointer; color: var(--muted); transition: all .18s var(--ease); user-select: none;
  }
  .filter-pill:active { transform: scale(.93); }
  .filter-pill.active { background: var(--ink); color: #fff; }
  @media (hover: hover) {
    .filter-pill:not(.active):hover { background: #e8e8f0; color: var(--ink); }
  }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 999px;
    font-weight: 700; font-size: 13px; box-shadow: var(--shadow-lg); z-index: 50;
    animation: toastIn .3s var(--ease);
    max-width: 90vw; text-align: center;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translate(-50%, 14px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  .footer-note { text-align: center; color: var(--muted); font-size: 12px; margin-top: 10px; }
  .switch-user {
    font-size: 12px; color: var(--muted); text-decoration: underline; cursor: pointer;
    transition: color .15s var(--ease);
  }
  .switch-user:hover { color: var(--purple); }

  .share-card-inner { position: relative; overflow: hidden; }
  .share-card-inner::before {
    content: ""; position: absolute; top: -60px; left: -60px; width: 180px; height: 180px;
    background: rgba(255,255,255,.12); border-radius: 50%;
  }
  .share-card-inner::after {
    content: ""; position: absolute; bottom: -70px; right: -50px; width: 200px; height: 200px;
    background: rgba(255,255,255,.10); border-radius: 50%;
  }

  /* ---------- rank + special role ---------- */
  .rank-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .rank-badge {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 16px;
    color: #fff; box-shadow: var(--shadow); animation: floatIn .4s var(--ease);
  }
  .rank-emoji { font-size: 26px; }
  .rank-name { font-weight: 800; font-size: 15px; }
  .rank-sub { font-size: 11px; opacity: .9; font-weight: 600; }
  .role-chip {
    display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px;
    background: linear-gradient(135deg, #ffe28a, #ffc93c); color: #7a5900;
    padding: 9px 14px; border-radius: 999px; box-shadow: 0 4px 12px rgba(255,201,60,.35);
    animation: shimmerPop .4s var(--ease);
  }
  .role-hint {
    margin-top: 12px; font-size: 12px; color: var(--muted); background: #f7f6ff;
    padding: 10px 12px; border-radius: 12px; text-align: center;
  }
  .progress-track {
    margin-top: 14px; height: 10px; border-radius: 999px; background: #f0f0f5; overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 999px; transition: width .5s var(--ease);
  }
  .share-tag-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .share-tag {
    font-size: 12px; font-weight: 800; padding: 5px 12px; border-radius: 999px;
    background: rgba(255,255,255,.2);
  }
  .share-tag.role { background: rgba(255,255,255,.32); }
  .lead-rank-emoji { font-size: 15px; margin-left: 4px; }
  .lead-role-chip {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800;
    background: linear-gradient(135deg, #ffe28a, #ffc93c); color: #7a5900;
    padding: 3px 9px; border-radius: 999px; margin-left: 6px; white-space: nowrap;
  }

  /* mobile tweaks */
  @media (max-width: 480px) {
    .wrap { padding: 12px 12px 90px; }
    .card { padding: 16px; border-radius: 16px; }
    .tab { min-width: 72px; padding: 9px 10px; font-size: 13px; }
    .points-banner { padding: 18px 18px; }
  }
</style>
</head>
<body>
<div id="splash"><div class="emoji">🏆</div><div class="txt">Loading the fun...</div></div>
<div id="root"></div>

const ADMIN_PASSCODE = "OMNT@1234"; // change this!

const CATEGORIES = [
  { id: "academics", label: "📚 Academics", color: "#3b9dff" },
  { id: "sports", label: "🏆 Sports", color: "#34d399" },
  { id: "gaming", label: "🎮 Gaming", color: "#ff5da2" },
  { id: "other", label: "✨ Other", color: "#ffc93c" },
];

function catInfo(id) {
  return CATEGORIES.find(c => c.id === id) || CATEGORIES[3];
}

const RANKS = [
  { min: 0,   name: "NPC",         emoji: "🎭", color: "#8a8a9a" },
  { min: 50,  name: "Trainee",     emoji: "🌱", color: "#3b9dff" },
  { min: 100, name: "Skilled",     emoji: "⭐", color: "#34d399" },
  { min: 150, name: "Pro",         emoji: "🔥", color: "#ffc93c" },
  { min: 200, name: "Elite",       emoji: "🎯", color: "#ff8a3b" },
  { min: 300, name: "Champion",    emoji: "🏆", color: "#ff5da2" },
  { min: 350, name: "Legend",      emoji: "👑", color: "#7c5cff" },
  { min: 400, name: "Untouchable", emoji: "💎", color: "#6a46ff" },
];

function getRank(points) {
  let r = RANKS[0];
  for (const tier of RANKS) if (points >= tier.min) r = tier;
  return r;
}

function getNextRank(points) {
  return RANKS.find(t => t.min > points) || null;
}

// Special title based on which category a student has the most APPROVED
// achievements in — needs at least 5 approved in that category to earn it,
// and that category must be strictly ahead of the others. The title levels
// up as the count grows: (1) at 5+, (2) at 15+, (3) at 25+, (4) at 35+, (5) at 50+.
const SPECIAL_ROLES = {
  academics: { name: "Brainiac",     emoji: "🧠" },
  sports:    { name: "Athlete",      emoji: "💪" },
  gaming:    { name: "Game Master",  emoji: "🎮" },
  other:     { name: "All-Rounder",  emoji: "✨" },
};
const ROLE_LEVELS = [
  { min: 5,  level: 1 },
  { min: 15, level: 2 },
  { min: 25, level: 3 },
  { min: 35, level: 4 },
  { min: 50, level: 5 },
];
const MIN_FOR_ROLE = ROLE_LEVELS[0].min;

function getRoleLevel(count) {
  let lvl = 0;
  for (const tier of ROLE_LEVELS) if (count >= tier.min) lvl = tier.level;
  return lvl;
}

function getSpecialRole(approvedAchievements) {
  const counts = { academics: 0, sports: 0, gaming: 0, other: 0 };
  approvedAchievements.forEach(a => { if (counts[a.category] !== undefined) counts[a.category]++; });
  const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const [topCat, topCount] = entries[0];
  const secondCount = entries[1] ? entries[1][1] : 0;
  if (topCount >= MIN_FOR_ROLE && topCount > secondCount) {
    const level = getRoleLevel(topCount);
    return { ...SPECIAL_ROLES[topCat], count: topCount, level, label: `${SPECIAL_ROLES[topCat].name} (${level})` };
  }
  return null;
}

function getStudentStats(userName, achievements) {
  const mine = achievements.filter(a => a.name === userName);
  const approved = mine.filter(a => a.status === "approved");
  const totalPoints = approved.reduce((s, a) => s + (Number(a.points) || 0), 0);
  const rank = getRank(totalPoints);
  const nextRank = getNextRank(totalPoints);
  const role = getSpecialRole(approved);
  return { mine, approved, totalPoints, rank, nextRank, role };
}

function initials(name) {
  return (name || "?").trim().split(/\s+/).map(w => w[0]).slice(0,2).join("").toUpperCase();
}

// Small round avatar used in lists/leaderboard/header
function MiniAvatar({ name, photoURL }) {
  if (photoURL) return <img className="mini-avatar" src={photoURL} alt="" />;
  return <div className="mini-avatar-fallback">{initials(name)}</div>;
}

// Big avatar with an edit/upload button, used on the profile page
function AvatarUploader({ name, photoURL, onUpload, uploading }) {
  const fileRef = useRef(null);
  return (
    <div className="avatar-uploader">
      <div className="avatar-img-circle">
        {photoURL ? <img src={photoURL} alt="" /> : initials(name)}
      </div>
      <label className="avatar-edit-btn" title="Change profile picture">
        {uploading ? "⏳" : "📷"}
        <input
          ref={fileRef}
          type="file"
          accept="image/*"
          onChange={e => { const f = e.target.files[0]; if (f) onUpload(f); e.target.value = ""; }}
        />
      </label>
    </div>
  );
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function Toast({ message }) {
  if (!message) return null;
  return <div className="toast">{message}</div>;
}

function NameGate({ onSet }) {
  const [name, setName] = useState("");
  return (
    <div className="name-gate">
      <div className="card name-card">
        <div className="logo-badge lg"><img src={LOGO_URI} alt="MVNX logo" /></div>
        <h2>Welcome to MVNX!</h2>
        <p style={{color: "var(--muted)", fontSize: 14}}>What's your name? We'll use it to track your achievements.</p>
        <input
          type="text"
          placeholder="Your name"
          value={name}
          onChange={e => setName(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && name.trim()) onSet(name.trim()); }}
        />
        <button className="btn" disabled={!name.trim()} onClick={() => onSet(name.trim())}>
          Let's go 🚀
        </button>
      </div>
    </div>
  );
}

function SubmitForm({ userName, onSubmitted, showToast }) {
  const [title, setTitle] = useState("");
  const [category, setCategory] = useState("academics");
  const [description, setDescription] = useState("");
  const [file, setFile] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const fileRef = useRef(null);

  const submit = async () => {
    if (!title.trim() || !file) {
      showToast("Add a title and proof image first! 📸");
      return;
    }
    setSubmitting(true);
    try {
      let imageUrl = "";
      if (firebaseReady) {
        const path = `proofs/${Date.now()}_${file.name}`;
        const ref = storage.ref().child(path);
        await ref.put(file);
        imageUrl = await ref.getDownloadURL();

        await db.collection("achievements").add({
          name: userName,
          title: title.trim(),
          category,
          description: description.trim(),
          imageUrl,
          status: "pending",
          points: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        });
      } else {
        imageUrl = await fileToDataUrl(file);
        onSubmitted({
          id: "local_" + Date.now(),
          name: userName, title: title.trim(), category,
          description: description.trim(), imageUrl,
          status: "pending", points: 0, createdAt: new Date(),
        });
      }
      showToast("Submitted! Waiting for approval ✨");
      setTitle(""); setDescription(""); setFile(null);
      if (fileRef.current) fileRef.current.value = "";
    } catch (e) {
      console.error(e);
      showToast("Oops, something went wrong.");
    }
    setSubmitting(false);
  };

  return (
    <div className="card">
      <h2>🌟 Submit an Achievement</h2>

      <label>Title</label>
      <input type="text" placeholder="e.g. Won the science fair!" value={title} onChange={e => setTitle(e.target.value)} />

      <label>Category</label>
      <div className="cat-row">
        {CATEGORIES.map(c => (
          <div
            key={c.id}
            className={"cat-pill" + (category === c.id ? " selected" : "")}
            style={category === c.id ? { background: c.color } : {}}
            onClick={() => setCategory(c.id)}
          >
            {c.label}
          </div>
        ))}
      </div>

      <label>Description (optional)</label>
      <textarea placeholder="Tell us a bit more..." value={description} onChange={e => setDescription(e.target.value)} />

      <label>Proof image</label>
      <label className={"file-btn" + (file ? " has-file" : "")}>
        📎 {file ? file.name : "Tap to upload a photo"}
        <input ref={fileRef} type="file" accept="image/*" style={{ display: "none" }}
          onChange={e => setFile(e.target.files[0] || null)} />
      </label>

      <button className="btn" onClick={submit} disabled={submitting}>
        {submitting ? "Uploading..." : "Submit Achievement 🚀"}
      </button>
    </div>
  );
}

function AchievementRow({ a }) {
  const cat = catInfo(a.category);
  return (
    <div className="ach-item">
      <img className="ach-thumb" src={a.imageUrl} alt="" loading="lazy" />
      <div className="ach-info">
        <div className="ach-title">{a.title}</div>
        <div className="ach-meta">{cat.label} · {a.name}</div>
      </div>
      {a.status === "approved"
        ? <span className="pts-chip">+{a.points} pts</span>
        : <span className={"badge " + a.status}>{a.status}</span>}
    </div>
  );
}

function MyProfile({ userName, achievements, photoURL, onUploadPhoto, uploadingPhoto }) {
  const { mine, totalPoints, rank, nextRank, role } = getStudentStats(userName, achievements);
  const pointsToNext = nextRank ? nextRank.min - totalPoints : 0;
  const progressPct = nextRank
    ? Math.min(100, Math.round(((totalPoints - rank.min) / (nextRank.min - rank.min)) * 100))
    : 100;

  return (
    <div>
      <div className="card" style={{ textAlign: "center" }}>
        <AvatarUploader name={userName} photoURL={photoURL} onUpload={onUploadPhoto} uploading={uploadingPhoto} />
        <div style={{ fontWeight: 800, fontSize: 16 }}>{userName}</div>
        <div style={{ fontSize: 12, color: "var(--muted)", marginTop: 2 }}>Tap 📷 to add or change your photo</div>
      </div>

      <div className="points-banner">
        <div>
          <div className="lbl">TOTAL POINTS</div>
          <div className="num">{totalPoints}</div>
        </div>
        <div className="avatar-circle">
          {photoURL ? <img src={photoURL} alt="" /> : initials(userName)}
        </div>
      </div>

      <div className="card">
        <div className="rank-row">
          <div className="rank-badge" style={{ background: rank.color }}>
            <span className="rank-emoji">{rank.emoji}</span>
            <div>
              <div className="rank-name">{rank.name}</div>
              {nextRank
                ? <div className="rank-sub">{pointsToNext} pts to {nextRank.name}</div>
                : <div className="rank-sub">Top rank reached! 🎊</div>}
            </div>
          </div>
          {role && (
            <div className="role-chip">
              <span>{role.emoji}</span> {role.label}
            </div>
          )}
        </div>
        {nextRank && (
          <div className="progress-track">
            <div className="progress-fill" style={{ width: progressPct + "%", background: rank.color }} />
          </div>
        )}
        {!role && (
          <div className="role-hint">
            Get {MIN_FOR_ROLE}+ approved achievements in one category to earn a special title, and level it up the more you get! 🎖️
          </div>
        )}
      </div>

      <div className="card">
        <h2>🏅 My Achievements</h2>
        {mine.length === 0 && (
          <div className="empty">
            <span className="emoji">🌱</span>
            No achievements yet — submit your first one!
          </div>
        )}
        {mine.slice().reverse().map(a => <AchievementRow key={a.id} a={a} />)}
      </div>
    </div>
  );
}

function ShareCard({ userName, achievements, showToast, photoURL }) {
  const { approved, totalPoints, rank, role } = getStudentStats(userName, achievements);
  const top = approved.slice(-3).reverse();

  return (
    <div className="card share-card-inner" style={{
      background: "linear-gradient(135deg, #7c5cff, #ff5da2)",
      color: "#fff", textAlign: "center"
    }}>
      <div style={{
        width: 74, height: 74, borderRadius: "50%", margin: "0 auto 10px", overflow: "hidden",
        background: "rgba(255,255,255,.2)", display: "flex", alignItems: "center", justifyContent: "center",
        fontSize: photoURL ? 0 : 28, fontWeight: 800, border: "3px solid rgba(255,255,255,.6)"
      }}>
        {photoURL ? <img src={photoURL} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : initials(userName)}
      </div>
      <div style={{ fontSize: 22, fontWeight: 900 }}>{userName}</div>
      <div className="share-tag-row">
        <span className="share-tag">{rank.emoji} {rank.name}</span>
        {role && <span className="share-tag role">{role.emoji} {role.label}</span>}
      </div>
      <div style={{ fontSize: 13, opacity: .9, marginTop: 8, marginBottom: 10 }}>MVNX Profile</div>
      <div style={{ fontSize: 40, fontWeight: 900 }}>{totalPoints}</div>
      <div style={{ fontSize: 12, opacity: .9, marginBottom: 14 }}>TOTAL POINTS</div>
      <div style={{ fontSize: 12, opacity: .9 }}>{approved.length} achievement{approved.length !== 1 ? "s" : ""} approved</div>
      {top.length > 0 && (
        <div style={{ marginTop: 14, textAlign: "left" }}>
          {top.map(a => (
            <div key={a.id} style={{
              background: "rgba(255,255,255,.15)", borderRadius: 12, padding: "8px 12px",
              marginBottom: 6, fontSize: 13, fontWeight: 700
            }}>
              {catInfo(a.category).label.split(" ")[0]} {a.title}
            </div>
          ))}
        </div>
      )}
      <button
        className="btn secondary"
        style={{ background: "rgba(255,255,255,.15)", color: "#fff", border: "2px solid rgba(255,255,255,.5)" }}
        onClick={() => {
          const roleText = role ? ` and is the resident ${role.label} ${role.emoji}` : "";
          const text = `${userName} is a ${rank.name} ${rank.emoji} with ${totalPoints} points on MVNX${roleText}!`;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(text);
            showToast("Copied to clipboard! 📋");
          }
        }}
      >
        📋 Copy Shareable Summary
      </button>
    </div>
  );
}

function Leaderboard({ achievements, profiles }) {
  const names = useMemo(() => {
    const set = new Set();
    achievements.filter(a => a.status === "approved").forEach(a => set.add(a.name));
    return Array.from(set);
  }, [achievements]);

  const rows = useMemo(() => {
    return names
      .map(name => {
        const { totalPoints, rank, role } = getStudentStats(name, achievements);
        return { name, totalPoints, rank, role };
      })
      .sort((a, b) => b.totalPoints - a.totalPoints);
  }, [names, achievements]);

  return (
    <div className="card">
      <h2>🔥 Leaderboard</h2>
      {rows.length === 0 && <div className="empty"><span className="emoji">🏁</span>No approved achievements yet.</div>}
      {rows.map((r, i) => (
        <div className="lead-row" key={r.name}>
          <div className="lead-rank">{i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `#${i + 1}`}</div>
          <MiniAvatar name={r.name} photoURL={profiles && profiles[r.name]} />
          <div className="lead-name">
            {r.name} <span className="lead-rank-emoji" title={r.rank.name}>{r.rank.emoji}</span>
            {r.role && <span className="lead-role-chip">{r.role.emoji} {r.role.label}</span>}
          </div>
          <div className="lead-pts">{r.totalPoints} pts</div>
        </div>
      ))}
    </div>
  );
}

function AdminPanel({ achievements, onDecide, isAdmin, onLogin }) {
  const [pass, setPass] = useState("");
  const [filter, setFilter] = useState("pending");
  const [pointsMap, setPointsMap] = useState({});

  if (!isAdmin) {
    return (
      <div className="card">
        <h2>🔐 Admin Login</h2>
        <label>Passcode</label>
        <input type="password" value={pass} onChange={e => setPass(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter") onLogin(pass); }} placeholder="Enter admin passcode" />
        <button className="btn" onClick={() => onLogin(pass)}>Unlock Admin Panel</button>
      </div>
    );
  }

  const filtered = achievements.filter(a => filter === "all" ? true : a.status === filter);

  return (
    <div className="card">
      <h2>🛠️ Admin Panel</h2>
      <div className="filter-row">
        {["pending", "approved", "rejected", "all"].map(f => (
          <div key={f} className={"filter-pill" + (filter === f ? " active" : "")} onClick={() => setFilter(f)}>
            {f[0].toUpperCase() + f.slice(1)}
          </div>
        ))}
      </div>

      {filtered.length === 0 && <div className="empty"><span className="emoji">📭</span>Nothing here.</div>}

      {filtered.slice().reverse().map(a => {
        const cat = catInfo(a.category);
        return (
          <div className="admin-item" key={a.id}>
            <div className="admin-row-top">
              <div>
                <div className="ach-title">{a.title}</div>
                <div className="ach-meta">{cat.label} · by {a.name}</div>
              </div>
              <img className="ach-thumb" src={a.imageUrl} alt="" loading="lazy" />
            </div>
            {a.description && <div className="admin-desc">{a.description}</div>}

            {a.status === "pending" ? (
              <div className="admin-actions">
                <input
                  className="pts-input"
                  type="number"
                  min="0"
                  placeholder="pts"
                  value={pointsMap[a.id] ?? ""}
                  onChange={e => setPointsMap({ ...pointsMap, [a.id]: e.target.value })}
                />
                <button className="mini-btn approve" onClick={() => onDecide(a, "approved", Number(pointsMap[a.id]) || 0)}>
                  ✅ Approve
                </button>
                <button className="mini-btn reject" onClick={() => onDecide(a, "rejected", 0)}>
                  ❌ Reject
                </button>
              </div>
            ) : (
              <div className="admin-actions">
                <span className={"badge " + a.status}>{a.status}</span>
                {a.status === "approved" && <span className="pts-chip">+{a.points} pts</span>}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function App() {
  const [userName, setUserName] = useState(() => localStorage.getItem("ach_user") || "");
  const [tab, setTab] = useState("submit");
  const [achievements, setAchievements] = useState([]);
  const [profiles, setProfiles] = useState({}); // name -> photoURL
  const [uploadingPhoto, setUploadingPhoto] = useState(false);
  const [isAdmin, setIsAdmin] = useState(false);
  const [toast, setToast] = useState("");

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(""), 2500);
  };

  useEffect(() => {
    if (!firebaseReady) return;
    const unsub = db.collection("achievements").orderBy("createdAt", "asc")
      .onSnapshot(snap => {
        setAchievements(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      }, err => console.error(err));
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!firebaseReady) {
      // local demo mode: load any saved avatars from localStorage
      try {
        const saved = JSON.parse(localStorage.getItem("ach_profiles") || "{}");
        setProfiles(saved);
      } catch (e) { /* ignore */ }
      return;
    }
    const unsub = db.collection("profiles").onSnapshot(snap => {
      const map = {};
      snap.docs.forEach(d => { map[d.id] = d.data().photoURL; });
      setProfiles(map);
    }, err => console.error(err));
    return () => unsub();
  }, []);

  const handleSetName = (name) => {
    localStorage.setItem("ach_user", name);
    setUserName(name);
  };

  const handleLocalSubmit = (a) => setAchievements(prev => [...prev, a]);

  const handleDecide = async (a, status, points) => {
    if (firebaseReady) {
      await db.collection("achievements").doc(a.id).update({ status, points });
    } else {
      setAchievements(prev => prev.map(x => x.id === a.id ? { ...x, status, points } : x));
    }
    showToast(status === "approved" ? `Approved! +${points} pts 🎉` : "Rejected.");
  };

  const handleUploadPhoto = async (file) => {
    if (!file || !userName) return;
    setUploadingPhoto(true);
    try {
      if (firebaseReady) {
        const path = `avatars/${encodeURIComponent(userName)}`;
        const ref = storage.ref().child(path);
        await ref.put(file);
        const photoURL = await ref.getDownloadURL();
        await db.collection("profiles").doc(userName).set({ photoURL }, { merge: true });
      } else {
        const dataUrl = await fileToDataUrl(file);
        setProfiles(prev => {
          const next = { ...prev, [userName]: dataUrl };
          localStorage.setItem("ach_profiles", JSON.stringify(next));
          return next;
        });
      }
      showToast("Profile picture updated! 📸");
    } catch (e) {
      console.error(e);
      showToast("Couldn't upload that photo, try again.");
    }
    setUploadingPhoto(false);
  };

  const handleAdminLogin = (pass) => {
    if (pass === ADMIN_PASSCODE) {
      setIsAdmin(true);
      showToast("Welcome, admin! 🔐");
    } else {
      showToast("Wrong passcode 🙅");
    }
  };

  if (!userName) return <NameGate onSet={handleSetName} />;

  const myPhoto = profiles[userName];

  return (
    <div className="wrap">
      <div className="header">
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div className="logo-badge"><img src={LOGO_URI} alt="MVNX logo" /></div>
          <div>
            <div className="logo">MVN<span className="dot">X</span></div>
            <div className="app-subtitle">MVN eXpose</div>
          </div>
        </div>
        <div className="switch-user" onClick={() => { localStorage.removeItem("ach_user"); setUserName(""); }} style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <MiniAvatar name={userName} photoURL={myPhoto} />
          {userName} · switch
        </div>
      </div>

      <div className="tabs">
        <div className={"tab" + (tab === "submit" ? " active" : "")} onClick={() => setTab("submit")}>Submit</div>
        <div className={"tab" + (tab === "profile" ? " active" : "")} onClick={() => setTab("profile")}>My Profile</div>
        <div className={"tab" + (tab === "share" ? " active" : "")} onClick={() => setTab("share")}>Share Card</div>
        <div className={"tab" + (tab === "leaderboard" ? " active" : "")} onClick={() => setTab("leaderboard")}>Leaderboard</div>
        <div className={"tab" + (tab === "admin" ? " active" : "")} onClick={() => setTab("admin")}>Admin</div>
      </div>

      {!firebaseReady && (
        <div className="card" style={{ background: "#fff4d6", color: "#8a6d00" }}>
          ⚠️ Firebase isn't configured yet — running in local demo mode (data won't persist or sync). Add your Firebase config at the top of the file to go live.
        </div>
      )}

      <div key={tab}>
        {tab === "submit" && <SubmitForm userName={userName} onSubmitted={handleLocalSubmit} showToast={showToast} />}
        {tab === "profile" && (
          <MyProfile
            userName={userName}
            achievements={achievements}
            photoURL={myPhoto}
            onUploadPhoto={handleUploadPhoto}
            uploadingPhoto={uploadingPhoto}
          />
        )}
        {tab === "share" && <ShareCard userName={userName} achievements={achievements} showToast={showToast} photoURL={myPhoto} />}
        {tab === "leaderboard" && <Leaderboard achievements={achievements} profiles={profiles} />}
        {tab === "admin" && (
          <AdminPanel achievements={achievements} onDecide={handleDecide} isAdmin={isAdmin} onLogin={handleAdminLogin} />
        )}
      </div>

      <div className="footer-note">Made with 💜 for celebrating wins, big and small.</div>
      <Toast message={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

// hide splash once mounted
requestAnimationFrame(() => {
  const splash = document.getElementById("splash");
  if (splash) { splash.classList.add("hide"); setTimeout(() => splash.remove(), 400); }
});

// set favicon to the MVNX logo
(() => {
  const link = document.createElement("link");
  link.rel = "icon";
  link.href = LOGO_URI;
  document.head.appendChild(link);
})();
</script>
</body>
</html>
